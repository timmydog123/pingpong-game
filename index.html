<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Retriever vs German Shepherd Pong</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Sniglet:wght@800&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            /* Your photo as the full page background */
            background: #1e272e url('https://i.ibb.co/L519p44/Screenshot-2026-09-22-at-12-12-38-PM.png') no-repeat center center fixed;
            background-size: cover;
            color: #2c3e50;
            font-family: 'Sniglet', 'Fredoka One', cursive, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            overflow: hidden;
        }

        /* Container framed nicely over the photo */
        .game-wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(2px);
            padding: 15px 20px;
            border-radius: 25px;
            border: 5px solid #FF9F43;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            max-width: 820px;
            width: 95%;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 28px;
            color: #FF5252;
            text-shadow: 2px 2px 0px #FFF, 3px 3px 0px #333;
            letter-spacing: 1.5px;
            text-align: center;
        }

        /* Settings Control Bar */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 12px;
            background: #FECA57;
            padding: 8px 16px;
            border-radius: 16px;
            border: 3px solid #FF9F43;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 0 #E58E26;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 15px;
            color: #222;
        }

        .controls select, .controls input {
            background: #FFF;
            color: #333;
            border: 2px solid #FF9F43;
            padding: 4px 8px;
            font-family: inherit;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            outline: none;
        }

        .btn {
            background: #10AC84;
            color: #FFF;
            font-family: inherit;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            padding: 6px 14px;
            border-radius: 12px;
            box-shadow: 0 3px 0 #10755a;
            transition: transform 0.1s, background 0.2s;
        }

        .btn:hover { background: #1dd1a1; }
        .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #10755a; }

        /* Arena Container positioned so Golden Retriever is LEFT and German Shepherd is RIGHT */
        .arena-container {
            position: relative;
            width: 760px;
            height: 320px;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            border: 6px solid #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Left Side: Golden Retriever Background Focus */
        .dog-side.dog-left {
            position: absolute;
            top: 0; bottom: 0; left: 0; width: 50%;
            background: url('https://i.ibb.co/L519p44/Screenshot-2026-09-22-at-12-12-38-PM.png') no-repeat;
            background-size: 210% auto;
            background-position: 5% 25%;
            border-right: 2px solid rgba(255, 255, 255, 0.5);
        }

        /* Right Side: German Shepherd Background Focus */
        .dog-side.dog-right {
            position: absolute;
            top: 0; bottom: 0; right: 0; width: 50%;
            background: url('https://i.ibb.co/L519p44/Screenshot-2026-09-22-at-12-12-38-PM.png') no-repeat;
            background-size: 210% auto;
            background-position: 95% 25%;
            border-left: 2px solid rgba(255, 255, 255, 0.5);
        }

        /* Compact Table Canvas overlaying in center */
        canvas {
            position: absolute;
            z-index: 2;
            background: rgba(46, 134, 222, 0.55); /* Semi-transparent blue court */
            border-radius: 10px;
            cursor: none;
        }

        .instructions {
            margin-top: 8px;
            font-size: 14px;
            color: #485460;
            background: #FFF;
            padding: 3px 12px;
            border-radius: 8px;
            font-weight: bold;
        }

        /* Scoreboard */
        .scoreboard {
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background: #54a0ff;
            border: 4px solid #2e86de;
            border-radius: 16px;
            padding: 6px 18px;
            box-shadow: 0 4px 0 #2e86de;
        }

        .player-card {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #FFF;
            padding: 4px 12px;
            border-radius: 12px;
            border: 3px solid #FF9F43;
        }

        .player-card.computer {
            border-color: #10AC84;
        }

        .score-info {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .score-label {
            font-size: 11px;
            color: #8395a7;
            font-weight: bold;
        }

        .score-val {
            font-size: 22px;
            color: #222;
            font-weight: bold;
        }

        .target-badge {
            background: #FF9F43;
            color: #FFF;
            padding: 5px 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 2px 0 #E58E26;
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <h1>🏓 GOLDEN RETRIEVER VS GERMAN SHEPHERD 🏓</h1>

        <div class="controls">
            <div class="control-group">
                <label for="difficulty">🎮 Level:</label>
                <select id="difficulty">
                    <option value="easy">🐶 Easy</option>
                    <option value="medium" selected>🐕 Medium</option>
                    <option value="hard">🐺 Hard</option>
                </select>
            </div>

            <div class="control-group">
                <label for="targetScore">🦴 Win Points:</label>
                <input type="number" id="targetScore" value="5" min="1" max="99" style="width: 50px;">
            </div>

            <button class="btn" id="restartBtn">🎾 Play Again!</button>
        </div>

        <!-- Arena containing Left/Right dogs and compact central game canvas -->
        <div class="arena-container">
            <!-- Left Side: Golden Retriever -->
            <div class="dog-side dog-left"></div>
            <!-- Right Side: German Shepherd -->
            <div class="dog-side dog-right"></div>

            <!-- Smaller Table Canvas (520x300) -->
            <canvas id="pongCanvas" width="520" height="300"></canvas>
        </div>
        
        <div class="instructions">🐾 Move Left Paddle: Use ↑ and ↓ Arrow Keys</div>

        <!-- Scoreboard -->
        <div class="scoreboard">
            <div class="player-card">
                <span style="font-size:24px">🐕</span>
                <div class="score-info">
                    <span class="score-label">GOLDEN RETRIEVER</span>
                    <span class="score-val" id="playerScoreDisplay">0</span>
                </div>
            </div>

            <div class="target-badge">
                FIRST TO <span id="targetDisplay">5</span> 🏆
            </div>

            <div class="player-card computer">
                <div class="score-info">
                    <span class="score-label">GERMAN SHEPHERD</span>
                    <span class="score-val" id="computerScoreDisplay">0</span>
                </div>
                <span style="font-size:24px">🐺</span>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('pongCanvas');
        const ctx = canvas.getContext('2d');

        const difficultySelect = document.getElementById('difficulty');
        const targetScoreInput = document.getElementById('targetScore');
        const restartBtn = document.getElementById('restartBtn');
        const playerScoreDisplay = document.getElementById('playerScoreDisplay');
        const computerScoreDisplay = document.getElementById('computerScoreDisplay');
        const targetDisplay = document.getElementById('targetDisplay');

        // Web Audio API Sound Effects
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'hit') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(450, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(850, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } else if (type === 'score') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            } else if (type === 'win') {
                [400, 500, 600, 800].forEach((freq, idx) => {
                    const noteOsc = audioCtx.createOscillator();
                    const noteGain = audioCtx.createGain();
                    noteOsc.connect(noteGain);
                    noteGain.connect(audioCtx.destination);
                    noteOsc.frequency.value = freq;
                    noteGain.gain.setValueAtTime(0.3, audioCtx.currentTime + idx * 0.1);
                    noteGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.1 + 0.15);
                    noteOsc.start(audioCtx.currentTime + idx * 0.1);
                    noteOsc.stop(audioCtx.currentTime + idx * 0.1 + 0.15);
                });
            }
        }

        // Game Constants adjusted for smaller canvas
        const PADDLE_WIDTH = 12;
        const PADDLE_HEIGHT = 65;
        const BALL_SIZE = 10;
        const PLAYER_SPEED = 7;

        let winningScore = 5;
        let isGameOver = false;

        let upPressed = false;
        let downPressed = false;

        const AI_SETTINGS = {
            easy:   { speed: 0.05, baseBallSpeed: 4.5 },
            medium: { speed: 0.09, baseBallSpeed: 6 },
            hard:   { speed: 0.15, baseBallSpeed: 7.5 }
        };

        // Golden Retriever Paddle (Left)
        const player = {
            x: 12,
            y: canvas.height / 2 - PADDLE_HEIGHT / 2,
            width: PADDLE_WIDTH,
            height: PADDLE_HEIGHT,
            score: 0,
            color: '#FF9F43'
        };

        // German Shepherd Paddle (Right)
        const computer = {
            x: canvas.width - 12 - PADDLE_WIDTH,
            y: canvas.height / 2 - PADDLE_HEIGHT / 2,
            width: PADDLE_WIDTH,
            height: PADDLE_HEIGHT,
            score: 0,
            color: '#10AC84'
        };

        // Tennis Ball
        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: BALL_SIZE,
            speed: 5.5,
            velocityX: 4,
            velocityY: 4,
            color: '#FFD700'
        };

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') upPressed = true;
            if (e.key === 'ArrowDown') downPressed = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp') upPressed = false;
            if (e.key === 'ArrowDown') downPressed = false;
        });

        restartBtn.addEventListener('click', resetGame);

        function drawRoundedRect(x, y, w, h, radius, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, radius);
            ctx.fill();
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function drawTennisBall(x, y, r) {
            ctx.fillStyle = '#feca57';
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#FFF';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(x - r/2, y, r/1.5, -Math.PI/2, Math.PI/2);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(x + r/2, y, r/1.5, Math.PI/2, -Math.PI/2);
            ctx.stroke();
        }

        function drawTableDetails() {
            // White Outer Court Border
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 4;
            ctx.strokeRect(0, 0, canvas.width, canvas.height);

            // Center Net
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.lineWidth = 3;
            ctx.setLineDash([8, 8]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawText(text, x, y, size = '26px', color = '#FFF') {
            ctx.fillStyle = color;
            ctx.font = `${size} 'Sniglet', 'Fredoka One', cursive`;
            ctx.textAlign = 'center';
            ctx.fillText(text, x, y);
        }

        function resetBall() {
            const currentDiff = difficultySelect.value;
            const baseSpeed = AI_SETTINGS[currentDiff].baseBallSpeed;

            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.speed = baseSpeed;
            
            ball.velocityX = (ball.velocityX > 0 ? -1 : 1) * (baseSpeed * 0.8);
            ball.velocityY = (Math.random() - 0.5) * baseSpeed;
        }

        function collision(b, p) {
            return (
                b.x + b.radius > p.x &&
                b.x - b.radius < p.x + p.width &&
                b.y + b.radius > p.y &&
                b.y - b.radius < p.y + p.height
            );
        }

        function update() {
            if (isGameOver) return;

            // Player Movement
            if (upPressed && player.y > 0) {
                player.y -= PLAYER_SPEED;
            }
            if (downPressed && player.y < canvas.height - player.height) {
                player.y += PLAYER_SPEED;
            }

            // AI Movement
            const diffConfig = AI_SETTINGS[difficultySelect.value];
            let targetY = ball.y - (computer.height / 2);
            computer.y += (targetY - computer.y) * diffConfig.speed;

            if (computer.y < 0) computer.y = 0;
            if (computer.y > canvas.height - computer.height) {
                computer.y = canvas.height - computer.height;
            }

            // Ball Movement
            ball.x += ball.velocityX;
            ball.y += ball.velocityY;

            // Wall bounce
            if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) {
                ball.velocityY = -ball.velocityY;
                playSound('hit');
            }

            // Collision Check
            let activePlayer = (ball.x < canvas.width / 2) ? player : computer;

            if (collision(ball, activePlayer)) {
                let collidePoint = (ball.y - (activePlayer.y + activePlayer.height / 2));
                collidePoint = collidePoint / (activePlayer.height / 2);

                let angleRad = (Math.PI / 4) * collidePoint;
                let direction = (ball.x < canvas.width / 2) ? 1 : -1;

                ball.speed += 0.25;
                ball.velocityX = direction * ball.speed * Math.cos(angleRad);
                ball.velocityY = ball.speed * Math.sin(angleRad);
                
                playSound('hit');
            }

            // Scoring
            if (ball.x - ball.radius < 0) {
                computer.score++;
                playSound('score');
                updateScoreboard();
                checkGameOver();
                if (!isGameOver) resetBall();
            } else if (ball.x + ball.radius > canvas.width) {
                player.score++;
                playSound('score');
                updateScoreboard();
                checkGameOver();
                if (!isGameOver) resetBall();
            }
        }

        function updateScoreboard() {
            playerScoreDisplay.textContent = player.score;
            computerScoreDisplay.textContent = computer.score;
        }

        function checkGameOver() {
            winningScore = parseInt(targetScoreInput.value) || 5;
            if (player.score >= winningScore || computer.score >= winningScore) {
                isGameOver = true;
                playSound('win');
            }
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Court lines
            drawTableDetails();

            // Draw Paddles
            drawRoundedRect(player.x, player.y, player.width, player.height, 6, player.color);
            drawRoundedRect(computer.x, computer.y, computer.width, computer.height, 6, computer.color);

            // Draw Ball
            drawTennisBall(ball.x, ball.y, ball.radius);

            // End Game Message Banner
            if (isGameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                if (player.score >= winningScore) {
                    drawText("🎉 GOLDEN RETRIEVER WINS! 🐕", canvas.width / 2, canvas.height / 2 - 10, '24px', '#FFD700');
                } else {
                    drawText("GERMAN SHEPHERD WINS! 🐺", canvas.width / 2, canvas.height / 2 - 10, '24px', '#10AC84');
                }
                drawText("Click 'Play Again!' to restart 🎾", canvas.width / 2, canvas.height / 2 + 25, '15px', '#FFF');
            }
        }

        function resetGame() {
            winningScore = parseInt(targetScoreInput.value) || 5;
            if (winningScore < 1) winningScore = 1;
            targetScoreInput.value = winningScore;
            targetDisplay.textContent = winningScore;

            player.score = 0;
            computer.score = 0;
            player.y = canvas.height / 2 - PADDLE_HEIGHT / 2;
            computer.y = canvas.height / 2 - PADDLE_HEIGHT / 2;

            updateScoreboard();
            isGameOver = false;
            resetBall();
        }

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        resetGame();
        gameLoop();
    </script>
</body>
</html>
