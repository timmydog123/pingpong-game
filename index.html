<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Retriever vs German Shepherd Pong</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Sniglet:wght@800&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #1e272e;
            color: #2c3e50;
            font-family: 'Sniglet', 'Fredoka One', cursive, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            overflow: hidden;
        }

        /* Container that holds the background dogs and the game canvas */
        .game-wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 30px;
            border: 6px solid #FF9F43;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
            max-width: 900px;
            width: 100%;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 34px;
            color: #FF5252;
            text-shadow: 2px 2px 0px #FFF, 4px 4px 0px #333;
            letter-spacing: 2px;
            text-align: center;
        }

        /* Settings Bar */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
            background: #FECA57;
            padding: 10px 18px;
            border-radius: 20px;
            border: 4px solid #FF9F43;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 0 #E58E26;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 16px;
            color: #222;
        }

        .controls select, .controls input {
            background: #FFF;
            color: #333;
            border: 3px solid #FF9F43;
            padding: 4px 8px;
            font-family: inherit;
            font-size: 15px;
            font-weight: bold;
            border-radius: 10px;
            outline: none;
        }

        .btn {
            background: #10AC84;
            color: #FFF;
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            padding: 6px 14px;
            border-radius: 12px;
            box-shadow: 0 4px 0 #10755a;
            transition: transform 0.1s, background 0.2s;
        }

        .btn:hover { background: #1dd1a1; }
        .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #10755a; }

        .btn-upload {
            background: #54a0ff;
            box-shadow: 0 4px 0 #2e86de;
        }
        .btn-upload:hover { background: #74b9ff; }

        /* Dog Background Panels Container */
        .arena-container {
            position: relative;
            width: 800px;
            height: 460px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            border: 8px solid #FFFFFF;
            display: flex;
        }

        /* Dog Photo Backgrounds */
        .dog-side {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 50%;
            background-size: cover;
            background-repeat: no-repeat;
            transition: filter 0.3s;
        }

        /* Left Side: Focuses on the Golden Retriever */
        .dog-left {
            left: 0;
            background-position: 15% 30%;
            border-right: 2px solid rgba(255, 255, 255, 0.4);
        }

        /* Right Side: Focuses on the German Shepherd */
        .dog-right {
            right: 0;
            background-position: 85% 30%;
            border-left: 2px solid rgba(255, 255, 255, 0.4);
        }

        /* Game Canvas overlaid on top of the Dog Backgrounds */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            background: transparent;
            cursor: none;
        }

        .instructions {
            margin-top: 10px;
            font-size: 15px;
            color: #576574;
            background: #FFF;
            padding: 4px 14px;
            border-radius: 10px;
            font-weight: bold;
        }

        /* Scoreboard */
        .scoreboard {
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background: #54a0ff;
            border: 4px solid #2e86de;
            border-radius: 20px;
            padding: 8px 20px;
            box-shadow: 0 5px 0 #2e86de;
        }

        .player-card {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #FFF;
            padding: 6px 14px;
            border-radius: 15px;
            border: 3px solid #EE5253;
        }

        .player-card.computer {
            border-color: #10AC84;
        }

        .score-info {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .score-label {
            font-size: 12px;
            color: #8395a7;
            font-weight: bold;
        }

        .score-val {
            font-size: 26px;
            color: #222;
            font-weight: bold;
        }

        .target-badge {
            background: #FF9F43;
            color: #FFF;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            box-shadow: 0 3px 0 #E58E26;
        }

        /* Photo Upload Modal / Notice */
        #photoNotice {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            z-index: 10;
            pointer-events: none;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <h1>🏓 GOLDEN RETRIEVER VS GERMAN SHEPHERD 🏓</h1>

        <div class="controls">
            <div class="control-group">
                <label for="difficulty">🎮 Level:</label>
                <select id="difficulty">
                    <option value="easy">🐶 Puppy (Easy)</option>
                    <option value="medium" selected>🐕 Doggy (Medium)</option>
                    <option value="hard">🐺 Alpha (Hard)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="targetScore">🦴 Win Points:</label>
                <input type="number" id="targetScore" value="5" min="1" max="99" style="width: 55px;">
            </div>

            <button class="btn btn-upload" onclick="document.getElementById('imageLoader').click()">📷 Load Dog Photo</button>
            <input type="file" id="imageLoader" accept="image/*" style="display: none;">

            <button class="btn" id="restartBtn">🎾 Play Again!</button>
        </div>

        <!-- Dog Background Arena -->
        <div class="arena-container" id="arena">
            <div id="photoNotice">👈 Click "📷 Load Dog Photo" above to select your photo!</div>
            <div class="dog-side dog-left" id="leftDog"></div>
            <div class="dog-side dog-right" id="rightDog"></div>
            <canvas id="pongCanvas" width="800" height="460"></canvas>
        </div>
        
        <div class="instructions">🐾 Controls: Move Left Paddle using ↑ and ↓ Arrow Keys</div>

        <!-- Scoreboard -->
        <div class="scoreboard">
            <div class="player-card">
                <span style="font-size:28px">🐕</span>
                <div class="score-info">
                    <span class="score-label">GOLDEN RETRIEVER</span>
                    <span class="score-val" id="playerScoreDisplay">0</span>
                </div>
            </div>

            <div class="target-badge">
                FIRST TO <span id="targetDisplay">5</span> 🏆
            </div>

            <div class="player-card computer">
                <div class="score-info">
                    <span class="score-label">GERMAN SHEPHERD</span>
                    <span class="score-val" id="computerScoreDisplay">0</span>
                </div>
                <span style="font-size:28px">🐺</span>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('pongCanvas');
        const ctx = canvas.getContext('2d');

        const leftDog = document.getElementById('leftDog');
        const rightDog = document.getElementById('rightDog');
        const imageLoader = document.getElementById('imageLoader');
        const photoNotice = document.getElementById('photoNotice');

        const difficultySelect = document.getElementById('difficulty');
        const targetScoreInput = document.getElementById('targetScore');
        const restartBtn = document.getElementById('restartBtn');
        const playerScoreDisplay = document.getElementById('playerScoreDisplay');
        const computerScoreDisplay = document.getElementById('computerScoreDisplay');
        const targetDisplay = document.getElementById('targetDisplay');

        // Web Audio API Sound Effects
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'hit') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(450, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(850, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } else if (type === 'score') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            } else if (type === 'win') {
                [400, 500, 600, 800].forEach((freq, idx) => {
                    const noteOsc = audioCtx.createOscillator();
                    const noteGain = audioCtx.createGain();
                    noteOsc.connect(noteGain);
                    noteGain.connect(audioCtx.destination);
                    noteOsc.frequency.value = freq;
                    noteGain.gain.setValueAtTime(0.3, audioCtx.currentTime + idx * 0.1);
                    noteGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.1 + 0.15);
                    noteOsc.start(audioCtx.currentTime + idx * 0.1);
                    noteOsc.stop(audioCtx.currentTime + idx * 0.1 + 0.15);
                });
            }
        }

        // Image Handler: Loads user photo and splits focus between Golden Retriever & German Shepherd
        imageLoader.addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const imgData = event.target.result;
                leftDog.style.backgroundImage = `url(${imgData})`;
                rightDog.style.backgroundImage = `url(${imgData})`;
                photoNotice.style.display = 'none';
            };
            if (e.target.files[0]) {
                reader.readAsDataURL(e.target.files[0]);
            }
        });

        // Game Constants & Variables
        const PADDLE_WIDTH = 18;
        const PADDLE_HEIGHT = 95;
        const BALL_SIZE = 14;
        const PLAYER_SPEED = 9;

        let winningScore = 5;
        let isGameOver = false;

        let upPressed = false;
        let downPressed = false;

        const AI_SETTINGS = {
            easy:   { speed: 0.048, baseBallSpeed: 6 },
            medium: { speed: 0.088, baseBallSpeed: 8 },
            hard:   { speed: 0.145, baseBallSpeed: 10 }
        };

        // Golden Retriever Paddle (Left)
        const player = {
            x: 18,
            y: canvas.height / 2 - PADDLE_HEIGHT / 2,
            width: PADDLE_WIDTH,
            height: PADDLE_HEIGHT,
            score: 0,
            color: '#FF9F43'
        };

        // German Shepherd Paddle (Right)
        const computer = {
            x: canvas.width - 18 - PADDLE_WIDTH,
            y: canvas.height / 2 - PADDLE_HEIGHT / 2,
            width: PADDLE_WIDTH,
            height: PADDLE_HEIGHT,
            score: 0,
            color: '#10AC84'
        };

        // Yellow Tennis Ball
        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: BALL_SIZE,
            speed: 7,
            velocityX: 5,
            velocityY: 5,
            color: '#FFD700'
        };

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') upPressed = true;
            if (e.key === 'ArrowDown') downPressed = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp') upPressed = false;
            if (e.key === 'ArrowDown') downPressed = false;
        });

        restartBtn.addEventListener('click', resetGame);

        function drawRoundedRect(x, y, w, h, radius, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, radius);
            ctx.fill();
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        function drawTennisBall(x, y, r) {
            ctx.fillStyle = '#feca57';
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#FFF';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(x - r/2, y, r/1.5, -Math.PI/2, Math.PI/2);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(x + r/2, y, r/1.5, Math.PI/2, -Math.PI/2);
            ctx.stroke();
        }

        function drawTableDetails() {
            // Semi-transparent center field overlay
            ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Table Border Lines
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 6;
            ctx.strokeRect(0, 0, canvas.width, canvas.height);

            // Center Net
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.lineWidth = 4;
            ctx.setLineDash([12, 12]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawText(text, x, y, size = '36px', color = '#FFF') {
            ctx.fillStyle = color;
            ctx.font = `${size} 'Sniglet', 'Fredoka One', cursive`;
            ctx.textAlign = 'center';
            ctx.fillText(text, x, y);
        }

        function resetBall() {
            const currentDiff = difficultySelect.value;
            const baseSpeed = AI_SETTINGS[currentDiff].baseBallSpeed;

            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.speed = baseSpeed;
            
            ball.velocityX = (ball.velocityX > 0 ? -1 : 1) * (baseSpeed * 0.8);
            ball.velocityY = (Math.random() - 0.5) * baseSpeed;
        }

        function collision(b, p) {
            return (
                b.x + b.radius > p.x &&
                b.x - b.radius < p.x + p.width &&
                b.y + b.radius > p.y &&
                b.y - b.radius < p.y + p.height
            );
        }

        function update() {
            if (isGameOver) return;

            // Player Movement
            if (upPressed && player.y > 0) {
                player.y -= PLAYER_SPEED;
            }
            if (downPressed && player.y < canvas.height - player.height) {
                player.y += PLAYER_SPEED;
            }

            // AI Movement
            const diffConfig = AI_SETTINGS[difficultySelect.value];
            let targetY = ball.y - (computer.height / 2);
            computer.y += (targetY - computer.y) * diffConfig.speed;

            if (computer.y < 0) computer.y = 0;
            if (computer.y > canvas.height - computer.height) {
                computer.y = canvas.height - computer.height;
            }

            // Ball Movement
            ball.x += ball.velocityX;
            ball.y += ball.velocityY;

            // Wall bounce
            if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) {
                ball.velocityY = -ball.velocityY;
                playSound('hit');
            }

            // Collision Check
            let activePlayer = (ball.x < canvas.width / 2) ? player : computer;

            if (collision(ball, activePlayer)) {
                let collidePoint = (ball.y - (activePlayer.y + activePlayer.height / 2));
                collidePoint = collidePoint / (activePlayer.height / 2);

                let angleRad = (Math.PI / 4) * collidePoint;
                let direction = (ball.x < canvas.width / 2) ? 1 : -1;

                ball.speed += 0.3;
                ball.velocityX = direction * ball.speed * Math.cos(angleRad);
                ball.velocityY = ball.speed * Math.sin(angleRad);
                
                playSound('hit');
            }

            // Scoring
            if (ball.x - ball.radius < 0) {
                computer.score++;
                playSound('score');
                updateScoreboard();
                checkGameOver();
                if (!isGameOver) resetBall();
            } else if (ball.x + ball.radius > canvas.width) {
                player.score++;
                playSound('score');
                updateScoreboard();
                checkGameOver();
                if (!isGameOver) resetBall();
            }
        }

        function updateScoreboard() {
            playerScoreDisplay.textContent = player.score;
            computerScoreDisplay.textContent = computer.score;
        }

        function checkGameOver() {
            winningScore = parseInt(targetScoreInput.value) || 5;
            if (player.score >= winningScore || computer.score >= winningScore) {
                isGameOver = true;
                playSound('win');
            }
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw field overlay and lines
            drawTableDetails();

            // Draw Paddles
            drawRoundedRect(player.x, player.y, player.width, player.height, 8, player.color);
            drawRoundedRect(computer.x, computer.y, computer.width, computer.height, 8, computer.color);

            // Draw Tennis Ball
            drawTennisBall(ball.x, ball.y, ball.radius);

            // Game Over Screen
            if (isGameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                if (player.score >= winningScore) {
                    drawText("🎉 GOLDEN RETRIEVER WINS! 🐕", canvas.width / 2, canvas.height / 2 - 10, '36px', '#FFD700');
                } else {
                    drawText("GERMAN SHEPHERD WINS! 🐺", canvas.width / 2, canvas.height / 2 - 10, '36px', '#10AC84');
                }
                drawText("Click 'Play Again!' to restart 🎾", canvas.width / 2, canvas.height / 2 + 35, '20px', '#FFF');
            }
        }

        function resetGame() {
            winningScore = parseInt(targetScoreInput.value) || 5;
            if (winningScore < 1) winningScore = 1;
            targetScoreInput.value = winningScore;
            targetDisplay.textContent = winningScore;

            player.score = 0;
            computer.score = 0;
            player.y = canvas.height / 2 - PADDLE_HEIGHT / 2;
            computer.y = canvas.height / 2 - PADDLE_HEIGHT / 2;

            updateScoreboard();
            isGameOver = false;
            resetBall();
        }

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        resetGame();
        gameLoop();
    </script>
</body>
</html>
